<body>
<div id="start">
  <div class="wrap">
    <div class="stitch"></div>
    <h1 id="logo-tap">YaKyoLife<br><em>棒球人生模擬器</em></h1>
    <div id="ver-badge" style="position:fixed;top:6px;right:8px;font-size:10px;letter-spacing:1px;color:var(--dim);opacity:.55;font-family:monospace;z-index:50;pointer-events:none">v1.4.1</div>
    <p class="sub">高中三年養成 → 選秀・旅日・旅美 → 國際賽 → 衰退與引退。每一顆骰子都算數。</p>
    <div class="field"><label>球員姓名</label><input id="in-name" maxlength="10" placeholder="例如：林家正" value=""></div>
    <div class="field"><label>守位</label>
      <div class="seg" id="seg-pos">
        <button data-v="P" class="on">投手</button><button data-v="C">捕手</button>
        <button data-v="IF">內野手</button><button data-v="OF">外野手</button>
      </div></div>
    <button class="btn main" style="margin-top:28px" id="btn-start">開始生涯 ▸ 高一春天</button>
    <details id="fld-display">
      <summary>顯示設定<span class="sum" id="disp-sum"></span></summary>
      <div id="disp-body">
        <div class="field"><label>佈景主題</label>
          <div class="seg two" id="seg-theme">
            <button data-t="a" class="on">深綠記分板</button><button data-t="b">電子看板</button>
            <button data-t="c">報紙版面</button><button data-t="d">現代儀表板</button>
          </div></div>
        <div class="field" id="fld-big"><label>字級</label>
          <div class="seg" id="seg-big">
            <button data-b="0" class="on">標準</button><button data-b="1">大字</button>
          </div></div>
        <div class="field" id="fld-ui"><label>介面版型</label>
          <div class="seg two" id="seg-ui">
            <button data-u="0" class="on">電腦版</button><button data-u="1">手機版</button>
          </div></div>
      </div>
    </details>
    <p class="seedline">世界種子
      <input id="seed-show" maxlength="24">
      · <a href="#" id="seed-re">換一個</a><br>相同種子＋相同選擇＝相同人生（可直接輸入朋友的種子碼）</p>
    <footer style="text-align:center;margin-top:22px;color:var(--dim);font-size:12px">Produced by <a href="https://www.threads.com/@mr.themost" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">最先生 Mr.TheMost</a></footer>
  </div>
</div>
<div id="app">
  <aside id="tl-side"><div id="tl-in">
    <div class="tl-brand"><span class="stitch small"></span><div><b>YaKyoLife</b><span class="sub">棒球人生模擬器</span></div></div>
    <div id="tl-list"></div>
    <div class="tl-seed">SEED <b id="tl-seed"></b><span class="tl-ver" id="tl-ver"></span></div>
  </div></aside>
  <div id="mid">
    <header id="board" style="display:none">
      <div id="bd-top"><div id="bd-name"></div><div id="bd-team"></div><span id="bd-tj" style="color:var(--dim);font-size:11px;margin-left:6px;white-space:nowrap"></span><button id="btn-menu" title="選單">選單</button></div>
      <div id="bd-grid">
        <div class="bd-cell"><b id="bd-age">16</b><span>年齡</span></div>
        <div class="bd-cell"><b id="bd-year">2026</b><span>年份</span></div>
        <div class="bd-cell"><b id="bd-ovr">30</b><span>綜合</span></div>
        <div class="bd-cell" id="bd-sal-cell" tabindex="0"><b id="bd-sal">0</b><span id="bd-sal-lbl">生涯薪(萬)</span><i class="bd-tip" id="bd-sal-tip"></i></div>
      </div>
      <div id="lamps">
        <span class="lamp" id="lp0"><i></i>季初</span>
        <span class="lamp" id="lp1"><i></i>賽季中</span>
        <span class="lamp" id="lp2"><i></i>季末</span>
      </div>
      <div id="tl-strip"></div>
    </header>
    <main id="log"></main>
  </div>
  <aside id="act-side"><div id="act-in">
    <div id="trait-side"><div class="tt">特質</div><div id="trait-tags"></div></div>
    <button id="act-toggle" style="display:none">⌄ 收合選項</button>
    <footer id="act" style="display:none"></footer>
  </div></aside>
</div>
<div id="modal"><div id="modal-box"></div></div>
<div id="alloc-full"><div id="af-inner"><div class="af-head"><span class="af-title" id="af-title"></span><button class="btn" id="af-close">收起</button></div><div id="af-body"></div></div></div>
<script src="game.js"></script>
</body>

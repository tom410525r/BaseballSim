<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#081510">
<title>YaKyoLife - 棒球人生模擬器</title>
<meta name="description" content="從高中三大賽到名人堂，一場種子化的台灣棒球員生涯模擬。選秀、旅外、國際賽、傷病、感情、引退——每一個決定都算數。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23fff%22 stroke=%22%23d0d0d0%22/%3E%3Cpath d=%22M8 6 Q13 16 8 26 M24 6 Q19 16 24 26%22 stroke=%22%23c0392b%22 stroke-width=%221.5%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#081510;--panel:#132920;--panel2:#1a382a;--edge:#2b4d3a;--text:#ece7d6;--dim:#93ab9c;
  --accent:#ffc95c;--good:#8fd08f;--bad:#e2695c;--info:#7fb3d5;--gold:#ffc95c;--r:10px;
  --sans:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --head:'Noto Sans TC',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --disp:'IBM Plex Mono',monospace;
  --glow:0 0 8px rgba(255,201,92,.35);
  --btnbg:linear-gradient(#2a5038,#1f3f2c);--btnedge:#3c6a4c;--btntx:#ece7d6;
  --bgfx:radial-gradient(ellipse 120% 60% at 50% -10%,rgba(29,70,48,.5) 0%,transparent 60%);
  --shadow:rgba(0,0,0,.35);
}
body[data-theme='b']{--bg:#07090c;--panel:#0c1014;--panel2:#10161c;--edge:#232c36;--text:#d8dde2;--dim:#5c6873;--accent:#ffb32e;--good:#49b675;--bad:#e2695c;--info:#3a7bd5;--gold:#ffb32e;--r:4px;--head:'DotGothic16',monospace;--disp:'DotGothic16',monospace;--glow:0 0 10px rgba(255,179,46,.6);--btnbg:#132018;--btnedge:#49b675;--btntx:#d8dde2;--bgfx:none;--shadow:rgba(0,0,0,.5)}
body[data-theme='c']{--bg:#f4efe1;--panel:#faf6ea;--panel2:#ece5d2;--edge:#1e1c18;--text:#1e1c18;--dim:#6f6857;--accent:#b3402f;--good:#2f6b3a;--bad:#b3402f;--info:#35506b;--gold:#b3402f;--r:0px;--head:'Noto Serif TC',serif;--disp:'Noto Serif TC',serif;--glow:none;--btnbg:#1e1c18;--btnedge:#1e1c18;--btntx:#f4efe1;--bgfx:none;--shadow:rgba(30,28,24,.12)}
body[data-theme='d']{--bg:#f6f7f6;--panel:#ffffff;--panel2:#f2f4f2;--edge:#e2e6e3;--text:#1a201c;--dim:#7a857e;--accent:#0f7b4d;--good:#0f7b4d;--bad:#c0392b;--info:#4a76a8;--gold:#b8862d;--r:12px;--glow:none;--btnbg:#0f7b4d;--btnedge:#0f7b4d;--btntx:#ffffff;--bgfx:none;--shadow:rgba(26,32,28,.1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overscroll-behavior-y:none}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--bgfx);pointer-events:none}
a{color:var(--info)}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#mid{flex:1;display:flex;flex-direction:column;min-width:0}
#tl-side{display:none;background:var(--panel);border-right:1px solid var(--edge)}
#board{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:2px solid var(--edge);padding:10px 14px 8px;box-shadow:0 6px 18px var(--shadow);padding-top:calc(10px + env(safe-area-inset-top,0px))}
#bd-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#bd-name{font-family:var(--head);font-weight:900;font-size:17px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bd-name small{color:var(--dim);font-weight:500;font-size:12px;margin-left:6px;font-family:var(--sans)}
#bd-team{color:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
#bd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.bd-cell{position:relative;background:var(--panel2);border:1px solid var(--edge);border-radius:var(--r);padding:4px 6px 3px;text-align:center}
.bd-cell b{display:block;font-family:var(--disp);font-size:17px;font-weight:700;color:var(--accent);text-shadow:var(--glow);line-height:1.2}
.bd-cell span{font-size:10px;color:var(--dim);letter-spacing:.15em}
#bd-sal,#bd-sal-lbl{white-space:nowrap}
#bd-sal-cell{cursor:pointer;outline:none}
.bd-tip{position:absolute;top:calc(100% + 6px);right:0;z-index:3;white-space:nowrap;font-style:normal;font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:0;color:var(--text);background:var(--panel2);border:1px solid var(--edge);border-radius:min(var(--r),6px);padding:4px 8px;box-shadow:0 4px 12px var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s}
@media (hover:hover){ #bd-sal-cell:hover .bd-tip{opacity:1} }
#bd-sal-cell.show .bd-tip,#bd-sal-cell:focus-visible .bd-tip{opacity:1}
@keyframes bd-unitflip{0%{color:var(--dim)}15%{color:var(--accent);text-shadow:var(--glow)}60%{color:var(--accent);text-shadow:var(--glow)}100%{color:var(--dim);text-shadow:none}}
#bd-sal-lbl.unitflip{animation:bd-unitflip 1.6s ease-out 1}
#lamps{display:flex;gap:14px;justify-content:center;margin-top:7px}
.lamp{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);letter-spacing:.12em}
.lamp i{width:9px;height:9px;border-radius:50%;background:var(--panel2);border:1px solid var(--edge);display:inline-block}
.lamp.on{color:var(--text);font-weight:700} .lamp.on i{background:var(--accent);box-shadow:var(--glow);border-color:var(--accent)}
#tl-strip{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
#tl-strip:empty{display:none}
.tl-chip{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--edge);border-radius:999px;padding:3px 10px;white-space:nowrap;flex:none;cursor:pointer}
.tl-chip.now{color:var(--accent);border-color:var(--accent);font-weight:700}
#tl-in{display:flex;flex-direction:column;gap:18px;padding:22px 16px 22px 22px}
.tl-brand{display:flex;align-items:center;gap:10px}
.tl-brand .stitch{flex:none}
.tl-brand b{font-family:var(--head);font-weight:900;font-size:16px;letter-spacing:.06em;display:block;line-height:1.3}
.tl-brand span.sub{font-size:10px;color:var(--dim);letter-spacing:.2em;display:block}
#tl-list{flex:0 1 auto;min-height:40px;overflow-y:auto}
#tl-wrap{position:relative;padding-left:16px}
#tl-wrap::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--edge)}
.tlg{margin-bottom:16px}
.tlg-h{font-family:var(--head);font-size:10px;letter-spacing:.3em;color:var(--dim);font-weight:700;margin-bottom:9px;padding-left:8px}
.tl-item{display:flex;align-items:center;gap:10px;margin-bottom:9px;cursor:pointer}
.tl-item .dot{width:10px;height:10px;border-radius:50%;background:var(--panel2);border:2px solid var(--edge);flex:none;margin-left:-13px}
.tl-item.now .dot{width:16px;height:16px;background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 12px var(--accent);margin-left:-16px}
.tl-item .t{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.45}
.tl-item.now .t{color:var(--accent);font-weight:700;font-size:13px}
.tl-item .t b{color:var(--accent);font-weight:700}
.tl-item.gone{cursor:default;opacity:.55}
.tl-seed{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:auto} 
.tl-seed b{color:var(--accent)}
.tl-ver{display:block;font-size:10px;opacity:.7;letter-spacing:.05em;margin-top:2px}
#log{flex:1;padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px}
.yr-block{display:flex;flex-direction:column;gap:10px}
.yr-body{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:12px 14px;animation:pop .25s ease;overflow-wrap:anywhere;overflow-x:auto}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h4{font-family:var(--head);font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.card h4::before{content:'■';font-size:9px;line-height:1;flex:none}
.card.gold{border:1.5px solid var(--gold)}
.card.gold h4{color:var(--gold);text-shadow:var(--glow)}
.card.bad h4{color:var(--bad)} .card.good h4{color:var(--good)} .card.info h4{color:var(--info)}
.card p{font-size:14px} .card p+p{margin-top:4px}
.tag{display:inline-block;font-family:var(--mono);font-size:12px;padding:0 6px;border-radius:min(var(--r),4px);background:var(--panel2);border:1px solid var(--edge);color:var(--accent);margin:0 2px}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}.hl{color:var(--accent);font-weight:700}
.statline{font-family:var(--mono);font-size:12.5px;color:var(--text);background:var(--panel2);border:1px dashed var(--edge);border-radius:min(var(--r),6px);padding:6px 10px;margin-top:6px;line-height:1.7}
table.fin,table.st{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:6px}
table.fin th,table.fin td,table.st th,table.st td{border-bottom:1px solid var(--edge);padding:4px 4px;text-align:right;white-space:nowrap}
table.fin th,table.st th{color:var(--dim);font-weight:500;letter-spacing:.05em}
table.fin td:first-child,table.fin th:first-child,table.st td:first-child,table.st th:first-child{text-align:left}
.divider{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.4em;padding:6px 0 0}
.divider::before,.divider::after{content:'———'}
.yr-head{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.3em;padding:8px 0 0;cursor:pointer;user-select:none}
.yr-head:hover{color:var(--accent)}
.yr-block.collapsed .yr-body{display:none}
.yr-block.collapsed .yr-head::after{content:' ▸'}
.yr-block:not(.collapsed) .yr-head.has-body::after{content:' ▾'}
#act-side{position:sticky;bottom:0;z-index:20;background:var(--panel);border-top:2px solid var(--edge);box-shadow:0 -8px 24px var(--shadow);max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#act-side.alloc{max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px)}
#act-in{display:flex;flex-direction:column}
#act-toggle{display:none;margin:8px auto 0;background:none;border:1px solid var(--edge);color:var(--dim);font-size:11px;font-family:var(--sans);padding:3px 14px;border-radius:999px;cursor:pointer;flex:none}
#act-toggle:hover{color:var(--accent);border-color:var(--accent)}
#act{padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
#act .title{font-family:var(--head);font-size:12px;letter-spacing:.2em;color:var(--dim);margin-bottom:8px;font-weight:700}
#act.collapsed{display:none!important}
.btn{display:block;width:100%;background:var(--panel2);border:1px solid var(--edge);color:var(--text);font-family:var(--sans);font-size:15px;font-weight:700;border-radius:var(--r);padding:11px 14px;margin-top:8px;cursor:pointer;text-align:left;transition:.15s}
.btn:active{transform:scale(.98)} .btn:hover{border-color:var(--accent)}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:2px}
.btn.main{background:var(--btnbg);border-color:var(--btnedge);color:var(--btntx);text-align:center}
.btn.main small{color:inherit;opacity:.8}
.btn.warn{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
#act .row2{display:flex;gap:8px}#act .row2 .btn{flex:1;text-align:center}
#trait-side{display:none}
#trait-side.empty{display:none!important}
#trait-side .tt{font-family:var(--head);font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:700;margin-bottom:8px}
#trait-tags{display:flex;flex-direction:column;gap:6px}
#trait-tags .trow{display:flex;align-items:center;gap:8px;min-width:0}
#trait-tags .trow .tag{flex:none}
#trait-tags .trow .td{flex:1;min-width:0;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dice{display:flex;align-items:flex-start;gap:8px;flex-wrap:nowrap;margin-bottom:10px}
.die{flex:1 1 0;max-width:44px;min-width:0;aspect-ratio:1;height:auto;border-radius:var(--r);background:#ece7d6;border:2px solid rgba(0,0,0,.16);color:#13291c;font-family:var(--disp);font-size:22px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s;position:relative;--stitch:rgba(179,64,47,.5);background-image:linear-gradient(rgba(255,255,255,.25),rgba(0,0,0,.08));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.die::after{content:'';position:absolute;inset:4px;border-radius:calc(var(--r)*.6);border:1.5px dashed var(--stitch);pointer-events:none}
.die.active{border-color:var(--accent);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
.die.used{opacity:.25;transform:scale(.9)}
.die.six{color:#b3402f}
body[data-theme='b'] .die{background:var(--panel2);background-image:none;color:var(--text);border-color:var(--edge);--stitch:rgba(226,105,92,.45);box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
body[data-theme='b'] .die.active{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 8px rgba(0,0,0,.6),0 0 12px color-mix(in srgb,var(--accent) 70%,transparent)}
body[data-theme='b'] .die.six{color:var(--bad)}
body[data-theme='c'] .die{background:#faf6ea;background-image:none;color:#1e1c18;border-color:#1e1c18;--stitch:rgba(179,64,47,.6);box-shadow:2.5px 2.5px 0 var(--edge)}
body[data-theme='c'] .die.active{border-color:var(--accent);box-shadow:2.5px 2.5px 0 var(--accent)}
body[data-theme='d'] .die{background:#ffffff;background-image:none;color:var(--text);border-color:var(--edge);--stitch:rgba(192,57,43,.45);box-shadow:0 2px 6px rgba(26,32,28,.18),inset 0 -2px 0 rgba(0,0,0,.05)}
body[data-theme='d'] .die.active{border-color:var(--accent);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 -2px 0 rgba(0,0,0,.05)}
@keyframes diceroll{0%{transform:translateY(-5px) rotate(-7deg)}50%{transform:translateY(2px) rotate(5deg)}100%{transform:none}}
.die.rolling{animation:diceroll .14s linear infinite}
@keyframes sixflash{0%,100%{box-shadow:none}45%{box-shadow:0 0 16px var(--bad),0 0 4px var(--bad)}}
.die.flash6{animation:sixflash .6s ease}
.pool{font-family:var(--mono);font-size:14px;color:var(--accent);font-weight:700;text-shadow:var(--glow);margin-bottom:10px}
.abrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--edge);border-radius:var(--r);padding:8px 10px;margin-top:6px;cursor:pointer;user-select:none}
.abrow:active{border-color:var(--accent)}
.abrow .nm{width:74px;font-size:13.5px;font-weight:700;flex:none}
.abrow .bar{flex:1;height:8px;background:var(--bg);border-radius:4px}
.abrow .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:.2s}
.abrow .val{font-family:var(--mono);width:62px;text-align:right;font-size:14px;flex:none}
.abrow .val b{color:var(--good)}
.abrow.capped{opacity:.45}
.bar{position:relative}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent);opacity:.5;border-radius:1px}
#start{position:fixed;inset:0;z-index:50;background:var(--bg);background-image:var(--bgfx);overflow-y:auto}
#start .wrap{max-width:560px;margin:0 auto;padding:44px 22px 60px;padding-top:calc(44px + env(safe-area-inset-top,0px))}
#start h1{font-family:var(--head);font-size:34px;font-weight:900;letter-spacing:.08em;line-height:1.25;margin-top:18px}
#start h1 em{font-style:normal;color:var(--accent);text-shadow:var(--glow)}
#start .sub{color:var(--dim);margin:10px 0 8px;font-size:13.5px;letter-spacing:.08em}
.field{margin-top:18px}
.field label{display:block;font-size:12px;letter-spacing:.25em;color:var(--dim);font-weight:700;margin-bottom:8px}
.field input{width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);color:var(--text);font-family:var(--sans);font-size:16px;padding:11px 14px;outline:none}
.field input:focus{border-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);color:var(--dim);font-family:var(--sans);font-size:13px;font-weight:700;padding:11px 2px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--accent);border-color:var(--accent)}
#fld-ui{display:none} 
#fld-display{margin-top:20px}
#fld-display>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:7px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--dim);padding:2px 0}
#fld-display>summary::-webkit-details-marker{display:none}
#fld-display>summary::before{content:'▸';font-size:10px;display:inline-block;transition:transform .15s;flex:none}
#fld-display[open]>summary::before{transform:rotate(90deg)}
#fld-display>summary:hover{color:var(--accent)}
#fld-display>summary .sum{opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#disp-body{padding-top:2px}
#disp-body .field:first-child{margin-top:10px}
.seedline{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:22px}
.seedline b{color:var(--accent)}
#seed-show{width:120px;background:var(--panel);color:var(--accent);border:1px solid var(--edge);border-radius:min(var(--r),6px);padding:2px 6px;font-family:inherit;font-size:12px;text-align:center}
.stitch{width:64px;height:64px;border-radius:50%;background:#ece7d6;position:relative;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.15)}
.stitch::before,.stitch::after{content:'';position:absolute;top:8px;bottom:8px;width:18px;border:3px dashed #b3402f;border-top:none;border-bottom:none}
.stitch::before{left:8px;border-right:none;border-radius:50% 0 0 50%}
.stitch::after{right:8px;border-left:none;border-radius:0 50% 50% 0}

function allocUI(mode,label,done){
  actClear(); const a=$('act'); const keys=POS_AB[S.pos];
  let dice=mode.dice?mode.dice.slice():null, pool=mode.pool||0, idx=0, hist=[];
  a.innerHTML=`<div class="title">${label}</div><div id="al-top"></div><div id="al-rows"></div><div class="row2" id="al-btm"></div>`;
  const touchedKeys={};
  const top=$('al-top'),rows=$('al-rows'),btm=$('al-btm');
  ALLOC={top,rows,btm,label,render};
  
  function remaining(){ return dice?dice.length-idx:pool; }
  function render(){
    if(dice){ top.innerHTML='<div id="dice">'+dice.map((v,i)=>`<div class="die ${i<idx?'used':''} ${i===idx?'active':''} ${v===6?'six':''}">${v}</div>`).join('')+'</div>'; }
    else top.innerHTML=`<div class="pool">剩餘可分配點數：${pool} 點（點一下能力 +1）</div>`;
    const cue=$('al-cue'); if(cue)cue.textContent=dice?`剩餘 ${remaining()} 顆骰子未分配`:`剩餘 ${remaining()} 點未分配`;
    
    rows.innerHTML='';
    keys.forEach(k=>{ const v=S.ab[k],cap=v>=80;
      const r=document.createElement('div'); r.className='abrow'+(cap?' capped':'');
      const pk=(S.pot&&S.pot[k])||62, cst=abCost(k), cr=(S.carry&&S.carry[k])||0;
      let c1, c2;
      if(v < 45) { c1 = '#8a3a3a'; c2 = '#e2695c'; }
      else if(v < 65) { c1 = '#8a6a2a'; c2 = '#ffc95c'; }
      else if(v < 80) { c1 = '#3c6a4c'; c2 = '#8fd08f'; }
      else { c1 = '#2874a6'; c2 = '#7fb3d5'; }
      r.innerHTML=`<span class="nm">${ABL[k]}</span><span class="bar"><i style="width:${v/80*100}%; background:linear-gradient(90deg,${c1},${c2})"></i><em style="left:${pk/80*100}%"></em></span><span class="val" style="line-height:1.1">${v}<small style="opacity:.5">/${pk}</small>${cst>1?`<span style="display:block;opacity:.5;font-size:10.5px;letter-spacing:1px;margin-top:-2px">${cr}/${cst}</span>`:''}</span>`;
      if(!cap&&remaining()>0)r.onclick=()=>{ const amt=dice?dice[idx]:1;
        const pc=(S.carry&&S.carry[k])||0;
        const got=addAb(k,amt); touchedKeys[k]=(touchedKeys[k]||0)+amt; hist.push([k,got,pc]); if(dice)idx++; else pool--;
        r.querySelector('.val').innerHTML=`${S.ab[k]} <b style="display:block;font-size:10.5px">${got>0?'+'+got:'蓄力中'}</b>`; render(); board(0); };
      rows.appendChild(r); });
      
    btm.innerHTML='';
    const u=document.createElement('button'); u.className='btn'; u.style.textAlign='center';
    u.textContent='↩ 復原'; u.disabled=!hist.length;
    u.style.opacity=hist.length?'1':'0.35'; u.style.cursor=hist.length?'pointer':'default';
    if(hist.length)u.onclick=()=>{ const [k,got,pc]=hist.pop(); S.ab[k]-=got; if(S.carry)S.carry[k]=pc; if(dice)idx--; else pool++; render(); board(0); };
    btm.appendChild(u);
    
    const allCap=keys.every(k=>S.ab[k]>=80);
    if(remaining()===0||allCap){ const c=document.createElement('button'); c.className='btn main';
      c.textContent=(remaining()>0&&allCap)?'能力已達上限，捨棄剩餘骰子 ▸':'確認 ▸';
      c.onclick=()=>{ actClear(); allocDone(touchedKeys,dice?true:false); done(); }; btm.appendChild(c); }
    actToggleSync();
  }

function renderTimeline(){

      const now=i===TL.length-1, gone=!(e.el&&e.el.isConnected);
      html+=`<div class="tl-item${now?' now':''}${(gone&&!now)?' gone':''}" data-i="${i}"><span class="dot"></span><span class="t">${e.year} ${e.lab}${e.note?' <b>'+e.note+'</b>':''}</span></div>`;
    });
    if(cur!==null)html+='</div>';
    list.innerHTML='<div id="tl-wrap">'+html+'</div>'; list.scrollTop=list.scrollHeight; 
  }
  if(strip){
    strip.innerHTML=TL.map((e,i)=>`<span class="tl-chip${i===TL.length-1?' now':''}" data-i="${i}">${e.year}${e.note?'★':''}</span>`).join('');

  }
}

function careerTimelineCard(){ 
  if(!TL.length)return;
  const eras=[]; TL.forEach(e=>{ const last=eras[eras.length-1]; if(last&&last.stage===e.stage)last.n++; else eras.push({stage:e.stage,from:e.year,n:1}); });
  const eraCols=['var(--info)','var(--good)','var(--accent)','var(--dim)'];
  const bands=eras.map((e,i)=>{ const to=e.from+e.n-1; const span=e.n>1?`${e.from}–${String(to).slice(2)}`:String(e.from); return `<div title="${e.stage} ${span}" style="flex:${e.n};min-width:0;background:var(--panel2);border-top:3px solid ${eraCols[i%4]};border-radius:var(--r);padding:6px 8px 5px"><div style="font-family:var(--head);font-size:11px;font-weight:700;letter-spacing:.08em;white-space:nowrap;overflow:hidden">${e.stage}</div><div style="font-family:var(--mono);font-size:10px;opacity:.75;white-space:nowrap;overflow:hidden">${span}</div></div>`; }).join('');
  const y0=TL[0].year, span=Math.max(1,TL.length-1); let ms=TL.filter(e=>e.note);
  if(ms.length>7)ms=ms.slice().sort((a,b)=>b.pri-a.pri||a.year-b.year).slice(0,7).sort((a,b)=>a.year-b.year);
  const estW=s=>{let w=0;for(const c of s)w+=c.codePointAt(0)>0x2E7F?10.5:7.5;return w;};
  const labW=e=>Math.max(estW(String(e.year)),estW(e.note))+10;
  let pxY=32,placed=null;
  while(!placed&&pxY<=320){ const axisW=TL.length*pxY-52,right=[],out=[]; for(const e of ms){ const x=(e.year-y0)/span*axisW,w=labW(e); let r=0; while(r<right.length&&x-w/2<right[r])r++; if(r>2){out.length=0;break;} right[r]=x+w/2;out.push({e,r}); } if(out.length===ms.length)placed=out;else pxY+=8; }
  if(!placed)placed=ms.map((e,j)=>({e,r:j%3})); 
  const maxR=placed.reduce((m,p)=>Math.max(m,p.r),0);
  const dots=placed.map(({e,r})=>`<div style="position:absolute;left:${((e.year-y0)/span*100).toFixed(2)}%;top:0;transform:translateX(-50%);text-align:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:var(--glow);display:block;margin:4px auto 0"></span><div style="margin-top:${4+r*38}px"><span style="font-family:var(--mono);font-size:10px;color:var(--dim);display:block;white-space:nowrap">${e.year}</span><span style="font-size:10.5px;font-weight:700;display:block;white-space:nowrap">${e.note}</span></div></div>`).join('');
  const minW=TL.length*pxY;
  card('','生涯時間軸',`<div style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin-top:4px;padding-bottom:4px"><div style="min-width:${minW}px"><div style="display:flex;gap:3px;margin-bottom:6px">${bands}</div><div style="margin:0 26px"><div style="position:relative;height:${62+38*maxR}px"><i style="position:absolute;left:0;right:0;top:8px;height:2px;background:var(--edge)"></i>${dots}</div></div></div></div>`);
}

function nextStep(){ if(S.done){ stepQ=[]; return; } const f=stepQ.shift(); if(f)f(); }

function phasePre(){
  board(0); S.tmpInj=0; S.seasonFactor=1; S.skipMid=false; S.prevD=S.lastD||0; S.lastD=0;

  if(S.rehab>0){ S.rehab--; S.skipMid=true; S.seasonFactor=0;
    card('bad','復健年',`大傷尚未痊癒，本季確定<b class="dn">全年報銷</b>，只能在復健室度過。（擲骰減為 2 顆）`);
    const dummySt = {G:0,PA:0,AB:0,H:0,HR:0,RBI:0,SB:0,BB:0,W:0,L:0,SV:0,HLD:0,IP:0,SO:0,ER:0,avg:0,era:0,WHIP:0,DEF:0,WAR:0};
    S.log.push({y:S.year,age:S.age,tm:S.stage==='PRO'?S.teamName():(S.team||stageLabel()),line:'復健年・全年報銷', inj: true, st: S.stage==='PRO'?dummySt:null}); }
  
  let afterAsk=()=>{
    let n=S.skipMid?2:(()=>{const r=R();return r<0.35?3:r<0.75?4:r<0.95?5:6;})();
    if(S.traits.distract&&!S.skipMid)n=Math.max(2,n-1);
    if(S.traits.academy&&!S.skipMid&&chance(35))n++;
    
    const dice=[]; let newSix=0;
    for(let i=0;i<n;i++){ const v=S.traits.genius?ri(4,6):S.traits.late?ri(3,6):ri(1,6); dice.push(v);
      if(v===6&&S.age<22&&!S.traits.genius){S.six++;newSix++;} }
      
    let msg=`自主訓練擲出 <b class="hl">${n}</b> 顆骰。`;
    if(newSix&&!S.traits.genius)msg+=` 高標值「6」累計 <b class="hl">${S.six}/5</b> 次。`;
    
    if(S.traits.combo && !S.skipMid && (S.comboKey||S.samePickKey)) {
      const ck = S.comboKey||S.samePickKey;
      const cv = S.traits.genius?ri(4,6):S.traits.late?ri(3,6):ri(1,6);
      const gained = addAb(ck, cv);
      const overflow = S.lastOverflow || 0;
      if(overflow > 0) S.pendStat = (S.pendStat || 0) + overflow;
      let cmsg = `<br>大巧不工發動：系統自動擲出 <b class="hl">${cv}</b> 點，挹注於 <b class="hl">${ABL[ck]}</b>`;
      if(gained > 0) cmsg += `（能力 <b class="up">+${gained}</b>）`;
      if(overflow > 0) cmsg += `（頂峰造極：溢出的 ${overflow} 點轉為<b class="up">本季成績加成</b>）`;
      if(gained===0 && overflow===0) cmsg += `（能力加點，但不足以提升一級）`;
      msg += cmsg + `。`;
    }
    
    card('','季初特訓',msg);
    if(S.six>=5&&!S.traits.genius&&S.age<22){ S.traits.genius=true;
      {
      const exDef=S.pos==='C'?['rng','fld','arm','cat']:[];
      const cands=POS_AB[S.pos].filter(k=>S.ab[k]<70&&!exDef.includes(k));
      for(let i=cands.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=cands[i];cands[i]=cands[j];cands[j]=t;}
      const boost=cands.slice(0,2), bl=[];
      boost.forEach(k=>{ S.pot[k]=Math.min(80,(S.pot[k]||62)+10);
        S.ab[k]=clamp(S.ab[k]+5,1,80); bl.push(`${ABL[k]} <b class="up">+5</b>（潛力上限 +10 → ${S.pot[k]}）`); });
      card('gold','隱藏素質解鎖：天才','22 歲前五度擲出高標值！從今以後，每一顆訓練骰<b class="hl">永久固定 4 點以上</b>，事件卡好結果機率提升至 <b class="hl">70%</b>。'+(bl.length?`天賦覺醒，潛能重新被評估：${bl.join('、')}。`:'')+'天賦，是藏不住的。');
      board(1);
    } }
    choose('',[{t:`▸ 分配訓練成果（${dice.length} 顆骰）`,main:true,f:()=>dposReview(()=>allocUI({dice},'分配訓練成果（點骰套用｜球探量表：'+((S.pos==='P'||S.pos==='TW')?'60/70/75':'70/75')+' 以上成長遞減）',()=>nextStep()))}]);
  };
  
  const preAsk=afterAsk;
  if((S.pos==='P'||S.pos==='TW')&&S.stage==='PRO'&&!S.skipMid){
    afterAsk=()=>{
      choose(`開季投球規劃（手臂狀況：${(function(){const r=S.tj/tjCap();return S.rehab>0?'復健中':r>=0.85?'手肘隱隱作痛':r>=0.6?'手臂略感疲勞':r>=0.35?'狀況尚可':'手感輕盈';})()}）`,[
        {t:'全力投',warn:true,s:'成績最佳｜手臂負荷最大（TJ 累積 ×1.25）',f:()=>{S.effort='全力投';preAsk();}},
        {t:'普通投',main:true,s:'標準強度｜TJ 累積正常',f:()=>{S.effort='普通投';preAsk();}},

      opts.push({t:'留在大學繼續磨練', main:true, f:afterAsk});
    }
    const agePenalty = Math.max(0, S.age - 18);

function movement(){
  const o=ovr();
  if(S.stage==='HS'){ if(S.stageYr<3)advance(); else pathChoiceHS(); return; }

  const path=PATHS[S.org], idx=path.indexOf(S.lv); let minReq=LV[S.lv].min; if(S.org==='NPB'&&S.npbYears>=8){ minReq-=4; }

  { const st=S.lastSt;

function termParams(d, lv){
  const cap = S.pos === 'P' ? 7 : 15;
  const maxY = faYears(d, cap);              
  const longEligible = maxY > 2 && d >= 0;    
  const longY = Math.max(3, maxY);           
  const shortY = Math.min(2, Math.max(1, maxY)); 
  let baseM = d >= 3 ? 1.2 : d >= 0 ? 1 : 0.8;
  if(S.traits.franchise) baseM = Math.max(baseM, 1.2);
  if(S.tradeRefuse > 0) baseM *= 0.85;
  return { longEligible, longY, shortY, longM: +(baseM * 0.92).toFixed(2), shortM: +(baseM * 1.12).toFixed(2) };
}
function termChoice(o, d, baseTitle, onPick, onReject){
  const tp = termParams(d, S.lv);
  const est = (y, m) => fmtMoney(Math.round(salaryFor(S.lv, d) * m));
  const opts = [];
  if(tp.longEligible){
    opts.push({t:`長約（${tp.longY} 年）`, main:true, s:`年限長、年薪係數略低 ×${tp.longM}（估 ${est(tp.longY, tp.longM)}/年）｜穩定保障`, f:()=>onPick(tp.longY, tp.longM)});
    opts.push({t:`短約（${tp.shortY} 年）`, warn:true, s:`年限短、年薪係數高 ×${tp.shortM}（估 ${est(tp.shortY, tp.shortM)}/年）｜賭下次身價`, f:()=>onPick(tp.shortY, tp.shortM)});
  } else { opts.push({t:`短約（${tp.shortY} 年）`, main:true, s:`年限短、年薪係數 ×${tp.shortM}（估 ${est(tp.shortY, tp.shortM)}/年）｜以目前的年齡與成績，球團只願提供短約`, f:()=>onPick(tp.shortY, tp.shortM)}); }
  if(onReject) opts.push({t:'拒絕，維持現狀', s:'不接受這份合約', f:onReject});
  choose(baseTitle, opts);
}
function extensionOffer(o){
  const d = S.lastD || 0;
  termChoice(o, d, `母隊提前延長續約 · ${S.teamName()}（合約剩 1 年）`, (y, m)=>{
    S.ct = {yrs: S.ct.yrs + y, mult: m, extOffered: true};
    card('gold', '延長續約', `與 <b class="hl">${S.teamName()}</b> 達成延長協議，追加 <b class="hl">${y} 年</b>（年薪係數 ×${m.toFixed(2)}）。`); 
    board(1); crossOffers(o);
  }, ()=>{ card('info', '婉拒延長', `你婉拒了母隊的提前延長，選擇打完現有合約再說。`); crossOffers(o); });
}
function outOfOrg(o){
  const offers = [];
  if(S.org !== 'NPB' && o >= 44) offers.push({t:'日職二軍（支配下）合約', f:()=>{buyoutRemaining(1); signTo('NPB','NPB2');}});
  if(S.org !== 'CPBL'){ 
    if(o >= 41) offers.push({t:'中職一軍合約', f:()=>{buyoutRemaining(1); signTo('CPBL','CPBL1');}});
    else if(o >= 30) offers.push({t:'中職二軍合約', f:()=>{buyoutRemaining(1); signTo('CPBL','CPBL2');}}); 
  }
  if(!offers.length){ buyoutRemaining(1); daibaFarewell(()=>endGame('遭球團釋出且無人問津，'+S.year+' 年黯然引退。')); return; }
  card('bad', '戰力外通告', `未達 ${S.org === 'NPB' ? '日職' : '原聯盟'}留用門檻，遭到釋出。所幸還有球隊捎來邀請——`);
  if(S.age >= 33){ offers.push({t:'就此引退', warn:true, f:()=>{buyoutRemaining(1); daibaFarewell(()=>endGame('收到戰力外通告後，'+S.year+' 年選擇引退。'));}}); }
  choose('新東家的邀請', offers.map(x=>({...x, f:()=>{x.f(); advance();}})));
}

  window.addEventListener('resize',updDispSum);
  (function(){ const det=document.getElementById('fld-display'); if(!det)return;
    const body=document.getElementById('disp-body'), sum=det.querySelector('summary');
    if(!body||!sum)return; let anim=null;
    sum.addEventListener('click',ev=>{
      if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      ev.preventDefault();
      if(anim){ anim.cancel(); anim=null; }
      const opening=!det.open;
      if(opening)det.open=true;
      const h=body.getBoundingClientRect().height;
      body.style.overflow='hidden';
      anim=body.animate({height:opening?['0px',h+'px']:[h+'px','0px'],
        opacity:opening?[0,1]:[1,0]},{duration:280,easing:'ease'});
      anim.onfinish=()=>{ body.style.overflow=''; anim=null; if(!opening)det.open=false; };
    }); })();
  let t='a'; try{t=localStorage.getItem('yakyu-theme')||'a';}catch(e){}
  document.querySelectorAll('#seg-theme button').forEach(b=>b.onclick=()=>applyTheme(b.dataset.t));
  applyTheme(t);
  ['tl-list','tl-strip'].forEach(id=>{ const el=$(id);
    if(el)el.onclick=ev=>{ const n=ev.target.closest('[data-i]'); if(n)tlScrollTo(TL[+n.dataset.i]); }; });
  const md=$('modal'); if(md)md.onclick=ev=>{ if(ev.target===md)modalClose(); };
  document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ modalClose(); allocFullClose(); } });
})();

let selPos='P';
document.getElementById('seed-show').value=SEED;
document.getElementById('seed-re').onclick=e=>{e.preventDefault();SEED=Math.random().toString(36).slice(2,10);document.getElementById('seed-show').value=SEED;};
document.querySelectorAll('#seg-pos button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg-pos button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); selPos=b.dataset.v;
});

function initGame(region) {
  const defName=(selPos==='P'||selPos==='TW')?'有有子':(selPos==='IF')?'抹茶多':(['黃鎖頭','藥帝士'][Math.floor(Math.random()*2)]);
  const nm=document.getElementById('in-name').value.trim()||defName;
  const sv=document.getElementById('seed-show').value.trim(); if(sv)SEED=sv;
  history.replaceState(null,'','?seed='+encodeURIComponent(SEED));
  seedInit(SEED); S=newState(nm,selPos,null);
  
  S.hsRegion = region;
  if(region === 'JP') { S.team = pick(['大阪桐蔭', '智辯和歌山', '仙台育英', '橫濱高校', '東海大相模']); }
  
  S.teamName=function(){
    if(!this.orgTeam)return ''; if(this.lv==='MLB')return this.orgTeam;
    if(LV[this.lv].org==='MiLB')return this.orgTeam+({R:'新人聯盟',A1:'1A',A2:'2A',A3:'3A'}[this.lv]);
    if(this.lv==='CPBL1'||this.lv==='NPB1')return this.orgTeam;
    return this.orgTeam+'二軍';
  };
  document.getElementById('start').style.display='none';
  document.getElementById('board').style.display=''; document.getElementById('act').style.display='';
  TL=[]; renderTimeline(); const ts=$('tl-seed'); if(ts)ts.textContent=SEED;
  
  const loc = region === 'JP' ? '日本' : '台灣';
  card('info','球員誕生',`${S.year} 年春天，${POSN[S.pos]} <b class="hl">${S.name}</b> 加入了 <b class="hl">${S.team}</b> 棒球隊，開始了在${loc}的訓練。三年後的路，要自己選。<br><span style="color:var(--dim);font-size:12px">提示：22 歲前累積擲出 5 次「6」可覺醒隱藏素質。</span>`);
  startYear();
}

document.getElementById('btn-start').onclick=() => initGame('TW');
document.getElementById('btn-start-jp').onclick=() => initGame('JP');
</script>
